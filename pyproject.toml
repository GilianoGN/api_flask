[project]
name = "apiflask"
version = "0.1.0"
description = ""
authors = [
    { name = "Giliano G. Novais", email = "vipergiliano@gmail.com" }
]
requires-python = ">=3.13, <4.0"
dependencies = [
    "Flask>=3.1.3,<4.0.0",
    "Flask-SQLAlchemy",
    "Flask-Migrate",
    "Flask-JWT-Extended>=4.6.0",
    "psycopg2-binary",
    "gunicorn",
]

[tool.pytest.ini_options]
addopts = "-ra -vvv"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src" }]

[dependency-groups]
dev = ["pytest"]
