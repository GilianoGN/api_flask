[project]
name = "apiflask"
version = "0.1.0"
description = "Flask REST API with JWT authentication and role-based access control"
authors = [
    { name = "Giliano G. Novais", email = "vipergiliano@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-migrate",
    "flask-jwt-extended",
    "psycopg2-binary",
    "gunicorn",
    "flask-bcrypt",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
]

[tool.pytest.ini_options]
addopts = "-vvv"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src" }]